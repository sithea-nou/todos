<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Todo App</title>
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body {
                font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
                background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
                min-height: 100vh;
                display: flex;
                justify-content: center;
                align-items: flex-start;
                padding: 40px 20px;
            }

            .container {
                width: 100%;
                max-width: 580px;
            }

            h1 {
                text-align: center;
                color: #fff;
                font-size: 2.8rem;
                font-weight: 300;
                letter-spacing: 8px;
                text-transform: uppercase;
                margin-bottom: 30px;
                text-shadow: 0 0 20px rgba(139, 92, 246, 0.5);
            }

            .input-section {
                display: flex;
                gap: 10px;
                margin-bottom: 20px;
            }

            .input-section input {
                flex: 1;
                padding: 16px 20px;
                border: 2px solid rgba(255, 255, 255, 0.1);
                border-radius: 12px;
                background: rgba(255, 255, 255, 0.07);
                color: #fff;
                font-size: 1rem;
                outline: none;
                transition:
                    border-color 0.3s,
                    background 0.3s;
            }

            .input-section input::placeholder {
                color: rgba(255, 255, 255, 0.4);
            }

            .input-section input:focus {
                border-color: #8b5cf6;
                background: rgba(255, 255, 255, 0.12);
            }

            .add-btn {
                padding: 16px 24px;
                border: none;
                border-radius: 12px;
                background: linear-gradient(135deg, #8b5cf6, #6d28d9);
                color: #fff;
                font-size: 1.4rem;
                cursor: pointer;
                transition:
                    transform 0.2s,
                    box-shadow 0.3s;
                box-shadow: 0 4px 15px rgba(139, 92, 246, 0.4);
            }

            .add-btn:hover {
                transform: scale(1.05);
                box-shadow: 0 6px 25px rgba(139, 92, 246, 0.6);
            }

            .add-btn:active {
                transform: scale(0.97);
            }

            .filters {
                display: flex;
                justify-content: center;
                gap: 8px;
                margin-bottom: 20px;
            }

            .filter-btn {
                padding: 8px 20px;
                border: 2px solid rgba(255, 255, 255, 0.15);
                border-radius: 25px;
                background: transparent;
                color: rgba(255, 255, 255, 0.6);
                font-size: 0.85rem;
                cursor: pointer;
                transition: all 0.3s;
            }

            .filter-btn:hover {
                border-color: rgba(139, 92, 246, 0.5);
                color: #fff;
            }

            .filter-btn.active {
                background: linear-gradient(135deg, #8b5cf6, #6d28d9);
                border-color: transparent;
                color: #fff;
            }

            .stats {
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding: 12px 20px;
                margin-bottom: 10px;
                color: rgba(255, 255, 255, 0.4);
                font-size: 0.85rem;
            }

            .clear-btn {
                background: none;
                border: none;
                color: #f87171;
                cursor: pointer;
                font-size: 0.85rem;
                transition: color 0.3s;
            }

            .clear-btn:hover {
                color: #ef4444;
            }

            .todo-list {
                list-style: none;
            }

            .todo-item {
                display: flex;
                align-items: center;
                gap: 14px;
                padding: 16px 20px;
                margin-bottom: 10px;
                background: rgba(255, 255, 255, 0.06);
                border: 1px solid rgba(255, 255, 255, 0.08);
                border-radius: 12px;
                transition: all 0.3s;
                animation: slideIn 0.3s ease-out;
            }

            @keyframes slideIn {
                from {
                    opacity: 0;
                    transform: translateY(-10px);
                }
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }

            .todo-item:hover {
                background: rgba(255, 255, 255, 0.1);
            }

            .todo-item.completed .todo-text {
                text-decoration: line-through;
                color: rgba(255, 255, 255, 0.3);
            }

            .checkbox {
                width: 22px;
                height: 22px;
                border: 2px solid rgba(255, 255, 255, 0.3);
                border-radius: 50%;
                cursor: pointer;
                display: flex;
                align-items: center;
                justify-content: center;
                flex-shrink: 0;
                transition: all 0.3s;
            }

            .checkbox:hover {
                border-color: #8b5cf6;
            }

            .checkbox.checked {
                background: linear-gradient(135deg, #8b5cf6, #6d28d9);
                border-color: transparent;
            }

            .checkbox.checked::after {
                content: "✓";
                color: #fff;
                font-size: 13px;
                font-weight: bold;
            }

            .todo-text {
                flex: 1;
                color: rgba(255, 255, 255, 0.85);
                font-size: 0.95rem;
                word-break: break-word;
            }

            .delete-btn {
                background: none;
                border: none;
                color: rgba(255, 255, 255, 0.2);
                font-size: 1.2rem;
                cursor: pointer;
                padding: 4px 8px;
                border-radius: 8px;
                transition: all 0.3s;
                flex-shrink: 0;
            }

            .delete-btn:hover {
                color: #f87171;
                background: rgba(248, 113, 113, 0.1);
            }

            .empty-state {
                text-align: center;
                padding: 50px 20px;
                color: rgba(255, 255, 255, 0.25);
            }

            .empty-state .icon {
                font-size: 3rem;
                margin-bottom: 15px;
            }

            .empty-state p {
                font-size: 1rem;
            }

            .progress-bar {
                width: 100%;
                height: 4px;
                background: rgba(255, 255, 255, 0.1);
                border-radius: 2px;
                margin-bottom: 20px;
                overflow: hidden;
            }

            .progress-fill {
                height: 100%;
                background: linear-gradient(90deg, #8b5cf6, #a78bfa);
                border-radius: 2px;
                transition: width 0.5s ease;
            }

            /* ── Chat widget ── */
            .chat-bubble {
                position: fixed;
                bottom: 28px;
                right: 28px;
                width: 56px;
                height: 56px;
                border-radius: 50%;
                border: none;
                background: linear-gradient(135deg, #8b5cf6, #6d28d9);
                color: #fff;
                font-size: 1.5rem;
                cursor: pointer;
                box-shadow: 0 4px 20px rgba(139, 92, 246, 0.5);
                transition: transform 0.2s, box-shadow 0.3s;
                z-index: 1000;
                display: flex;
                align-items: center;
                justify-content: center;
            }

            .chat-bubble:hover {
                transform: scale(1.1);
                box-shadow: 0 6px 28px rgba(139, 92, 246, 0.7);
            }

            .chat-panel {
                position: fixed;
                bottom: 96px;
                right: 28px;
                width: 360px;
                height: 500px;
                background: #1a1730;
                border: 1px solid rgba(139, 92, 246, 0.3);
                border-radius: 16px;
                display: flex;
                flex-direction: column;
                overflow: hidden;
                box-shadow: 0 8px 40px rgba(0, 0, 0, 0.5);
                z-index: 999;
                transition: opacity 0.2s, transform 0.2s;
            }

            .chat-panel.hidden {
                opacity: 0;
                pointer-events: none;
                transform: translateY(10px);
            }

            .chat-header {
                padding: 14px 18px;
                background: linear-gradient(135deg, rgba(139,92,246,0.25), rgba(109,40,217,0.15));
                border-bottom: 1px solid rgba(255, 255, 255, 0.08);
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 10px;
            }

            .chat-header-title {
                display: flex;
                align-items: center;
                gap: 10px;
                flex: 1;
                min-width: 0;
            }

            .chat-header-title > span {
                color: #fff;
                font-size: 0.95rem;
                font-weight: 500;
                letter-spacing: 0.5px;
            }

            .chat-provider {
                display: inline-flex;
                align-items: center;
                gap: 6px;
                padding: 3px 9px;
                border-radius: 999px;
                font-size: 0.7rem;
                font-weight: 500;
                background: rgba(139, 92, 246, 0.15);
                color: #c4b5fd;
                border: 1px solid rgba(139, 92, 246, 0.25);
                max-width: 220px;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }

            .chat-provider .dot {
                width: 6px;
                height: 6px;
                border-radius: 50%;
                background: #a78bfa;
                flex-shrink: 0;
            }

            .chat-provider.streaming .dot {
                background: #34d399;
                box-shadow: 0 0 6px #34d399;
            }

            .chat-provider.tool-ok .dot { background: #34d399; }
            .chat-provider.tool-warn .dot { background: #fbbf24; }

            .chat-header-right {
                display: flex;
                gap: 4px;
                align-items: center;
            }

            .chat-icon-btn {
                background: none;
                border: none;
                color: rgba(255, 255, 255, 0.5);
                font-size: 0.9rem;
                cursor: pointer;
                line-height: 1;
                padding: 4px 6px;
                border-radius: 6px;
                transition: background 0.15s, color 0.15s;
            }

            .chat-icon-btn:hover {
                background: rgba(255, 255, 255, 0.06);
                color: #fff;
            }

            .chat-tool-event {
                align-self: flex-start;
                max-width: 82%;
                padding: 6px 10px;
                border-radius: 8px;
                background: rgba(139, 92, 246, 0.1);
                color: rgba(255, 255, 255, 0.55);
                font-size: 0.72rem;
                font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, monospace;
                border: 1px solid rgba(139, 92, 246, 0.18);
            }

            .chat-close {
                background: none;
                border: none;
                color: rgba(255, 255, 255, 0.5);
                font-size: 1.1rem;
                cursor: pointer;
                line-height: 1;
                transition: color 0.2s;
            }

            .chat-close:hover { color: #fff; }

            .chat-messages {
                flex: 1;
                overflow-y: auto;
                padding: 16px;
                display: flex;
                flex-direction: column;
                gap: 10px;
                scrollbar-width: thin;
                scrollbar-color: rgba(139,92,246,0.3) transparent;
            }

            .chat-msg {
                max-width: 82%;
                padding: 10px 14px;
                border-radius: 12px;
                font-size: 0.875rem;
                line-height: 1.5;
                word-break: break-word;
                white-space: pre-wrap;
            }

            .chat-msg.user {
                align-self: flex-end;
                background: linear-gradient(135deg, #8b5cf6, #6d28d9);
                color: #fff;
                border-bottom-right-radius: 4px;
            }

            .chat-msg.assistant {
                align-self: flex-start;
                background: rgba(255, 255, 255, 0.08);
                color: rgba(255, 255, 255, 0.88);
                border-bottom-left-radius: 4px;
            }

            .chat-msg.thinking {
                align-self: flex-start;
                color: rgba(255, 255, 255, 0.4);
                font-style: italic;
                font-size: 0.8rem;
                padding: 6px 10px;
                background: transparent;
                display: flex;
                gap: 4px;
                align-items: center;
            }

            .chat-msg.thinking .dot {
                width: 5px;
                height: 5px;
                border-radius: 50%;
                background: rgba(139, 92, 246, 0.7);
                animation: bounce 1.2s infinite;
            }

            .chat-msg.thinking .dot:nth-child(2) { animation-delay: 0.2s; }
            .chat-msg.thinking .dot:nth-child(3) { animation-delay: 0.4s; }

            @keyframes bounce {
                0%, 60%, 100% { transform: translateY(0); }
                30% { transform: translateY(-5px); }
            }

            .chat-input-row {
                padding: 12px;
                border-top: 1px solid rgba(255, 255, 255, 0.07);
                display: flex;
                gap: 8px;
            }

            .chat-input {
                flex: 1;
                padding: 10px 14px;
                border: 1.5px solid rgba(255, 255, 255, 0.1);
                border-radius: 10px;
                background: rgba(255, 255, 255, 0.06);
                color: #fff;
                font-size: 0.875rem;
                outline: none;
                transition: border-color 0.2s;
                resize: none;
                font-family: inherit;
            }

            .chat-input:focus { border-color: #8b5cf6; }
            .chat-input::placeholder { color: rgba(255,255,255,0.3); }

            .chat-send {
                padding: 10px 16px;
                border: none;
                border-radius: 10px;
                background: linear-gradient(135deg, #8b5cf6, #6d28d9);
                color: #fff;
                font-size: 1rem;
                cursor: pointer;
                transition: transform 0.15s, box-shadow 0.2s;
                flex-shrink: 0;
            }

            .chat-send:hover:not(:disabled) {
                transform: scale(1.05);
                box-shadow: 0 2px 10px rgba(139,92,246,0.5);
            }

            .chat-send:disabled { opacity: 0.5; cursor: not-allowed; }
        </style>
    </head>
    <body>
        <div class="container">
            <h1>✅ Todos</h1>

            <div class="input-section">
                <input
                    type="text"
                    id="todoInput"
                    placeholder="What needs to be done?"
                    autofocus
                />
                <button class="add-btn" id="addBtn">+</button>
            </div>

            <div class="progress-bar">
                <div
                    class="progress-fill"
                    id="progressFill"
                    style="width: 0%"
                ></div>
            </div>

            <div class="filters">
                <button class="filter-btn active" data-filter="all">All</button>
                <button class="filter-btn" data-filter="active">Active</button>
                <button class="filter-btn" data-filter="completed">
                    Completed
                </button>
            </div>

            <div class="stats">
                <span id="taskCount">0 tasks left</span>
                <button class="clear-btn" id="clearCompleted">
                    Clear completed
                </button>
            </div>

            <ul class="todo-list" id="todoList"></ul>
        </div>

        <!-- Chat widget -->
        <button class="chat-bubble" id="chatBubble" title="AI Assistant">💬</button>

        <div class="chat-panel hidden" id="chatPanel">
            <div class="chat-header">
                <div class="chat-header-title">
                    <span>AI Assistant</span>
                    <span
                        class="chat-provider"
                        id="chatProvider"
                        title="Loading provider info…"
                    >
                        <span class="dot"></span>
                        <span id="chatProviderLabel">connecting…</span>
                    </span>
                </div>
                <div class="chat-header-right">
                    <button
                        class="chat-icon-btn"
                        id="chatNew"
                        title="Start a new chat session"
                    >
                        ＋
                    </button>
                    <button class="chat-icon-btn" id="chatClose" title="Close">
                        ✕
                    </button>
                </div>
            </div>
            <div class="chat-messages" id="chatMessages"></div>
            <div class="chat-input-row">
                <textarea
                    class="chat-input"
                    id="chatInput"
                    placeholder="Ask me to manage your todos…"
                    rows="1"
                ></textarea>
                <button class="chat-send" id="chatSend">➤</button>
            </div>
        </div>

        <script>
            const todoInput = document.getElementById("todoInput");
            const addBtn = document.getElementById("addBtn");
            const todoList = document.getElementById("todoList");
            const taskCount = document.getElementById("taskCount");
            const clearCompleted = document.getElementById("clearCompleted");
            const progressFill = document.getElementById("progressFill");
            const filterBtns = document.querySelectorAll(".filter-btn");

            let todos = [];
            let currentFilter = "all";

            // API base URL
            const API_BASE = "/api/todos";

            // Fetch all todos from the API
            async function fetchTodos() {
                try {
                    const response = await fetch(`${API_BASE}/`);
                    if (!response.ok) {
                        throw new Error(
                            `HTTP error! status: ${response.status}`,
                        );
                    }
                    const data = await response.json();
                    // Map API response to local format
                    todos = data.map((todo) => ({
                        id: todo.id,
                        text: todo.title,
                        completed: todo.is_completed,
                    }));
                } catch (error) {
                    console.error("Error fetching todos:", error);
                    alert("Failed to fetch todos. Please try again.");
                    todos = [];
                }
            }

            // Create a new todo
            async function createTodo(text) {
                try {
                    const response = await fetch(`${API_BASE}/`, {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json",
                        },
                        body: JSON.stringify({ title: text }),
                    });

                    if (!response.ok) {
                        throw new Error(
                            `HTTP error! status: ${response.status}`,
                        );
                    }
                    return await response.json();
                } catch (error) {
                    console.error("Error creating todo:", error);
                    alert("Failed to create todo. Please try again.");
                    return null;
                }
            }

            // Toggle todo completion status
            async function toggleTodoCompletion(id, is_completed) {
                try {
                    const response = await fetch(`${API_BASE}/${id}`, {
                        method: "PATCH",
                        headers: {
                            "Content-Type": "application/json",
                        },
                        body: JSON.stringify({ is_completed }),
                    });

                    if (!response.ok) {
                        throw new Error(
                            `HTTP error! status: ${response.status}`,
                        );
                    }
                    return await response.json();
                } catch (error) {
                    console.error("Error toggling todo:", error);
                    alert("Failed to update todo. Please try again.");
                    return null;
                }
            }

            // Delete a todo
            async function deleteTodoById(id) {
                try {
                    const response = await fetch(`${API_BASE}/${id}`, {
                        method: "DELETE",
                    });

                    if (!response.ok) {
                        throw new Error(
                            `HTTP error! status: ${response.status}`,
                        );
                    }
                } catch (error) {
                    console.error("Error deleting todo:", error);
                    alert("Failed to delete todo. Please try again.");
                }
            }

            // High-level functions that combine API calls with local state updates
            async function addTodo(text) {
                if (!text.trim()) return;

                const newTodo = await createTodo(text);
                if (newTodo) {
                    // Fetch updated list, then re-render the DOM
                    await fetchTodos();
                    render();
                    todoInput.value = "";
                }
            }

            async function toggleTodo(id) {
                // Find the todo and get its current completion status
                const todo = todos.find((t) => t.id === id);
                if (todo) {
                    const newStatus = !todo.completed;
                    await toggleTodoCompletion(id, newStatus);
                    // Fetch updated list, then re-render the DOM
                    await fetchTodos();
                    render();
                }
            }

            async function deleteTodo(id) {
                await deleteTodoById(id);
                // Fetch updated list, then re-render the DOM
                await fetchTodos();
                render();
            }

            async function clearCompletedTodos() {
                // Get all completed todo IDs
                const completedIds = todos
                    .filter((t) => t.completed)
                    .map((t) => t.id);
                // Delete each completed todo
                for (const id of completedIds) {
                    await deleteTodoById(id);
                }
                // Fetch updated list, then re-render the DOM
                await fetchTodos();
                render();
            }

            function getFilteredTodos() {
                switch (currentFilter) {
                    case "active":
                        return todos.filter((t) => !t.completed);
                    case "completed":
                        return todos.filter((t) => t.completed);
                    default:
                        return todos;
                }
            }

            function updateStats() {
                const activeCount = todos.filter((t) => !t.completed).length;
                const totalCount = todos.length;
                const completedCount = totalCount - activeCount;

                taskCount.textContent = `${activeCount} task${activeCount !== 1 ? "s" : ""} left`;

                const progress =
                    totalCount === 0 ? 0 : (completedCount / totalCount) * 100;
                progressFill.style.width = progress + "%";

                clearCompleted.style.visibility =
                    completedCount > 0 ? "visible" : "hidden";
            }

            function render() {
                const filtered = getFilteredTodos();
                todoList.innerHTML = "";

                if (filtered.length === 0) {
                    const emptyState = document.createElement("div");
                    emptyState.className = "empty-state";
                    let msg = "";
                    if (currentFilter === "all" && todos.length === 0) {
                        msg = "No todos yet. Add one above!";
                    } else if (currentFilter === "active") {
                        msg = "No active todos. Well done! 🎉";
                    } else {
                        msg = "No completed todos yet.";
                    }
                    emptyState.innerHTML = `<div class="icon">📋</div><p>${msg}</p>`;
                    todoList.appendChild(emptyState);
                } else {
                    filtered.forEach((todo) => {
                        const li = document.createElement("li");
                        li.className = `todo-item${todo.completed ? " completed" : ""}`;

                        li.innerHTML = `
                        <div class="checkbox${todo.completed ? " checked" : ""}" data-id="${todo.id}"></div>
                        <span class="todo-text">${escapeHtml(todo.text)}</span>
                        <button class="delete-btn" data-id="${todo.id}">✕</button>
                    `;

                        todoList.appendChild(li);
                    });
                }

                updateStats();
            }

            function escapeHtml(text) {
                const div = document.createElement("div");
                div.textContent = text;
                return div.innerHTML;
            }
            // Event Listeners - Updated to use async/await
            addBtn.addEventListener("click", () => addTodo(todoInput.value));

            todoInput.addEventListener("keypress", (e) => {
                if (e.key === "Enter") addTodo(todoInput.value);
            });

            todoList.addEventListener("click", async (e) => {
                const checkbox = e.target.closest(".checkbox");
                const deleteBtn = e.target.closest(".delete-btn");

                if (checkbox) {
                    await toggleTodo(checkbox.dataset.id);
                } else if (deleteBtn) {
                    await deleteTodo(deleteBtn.dataset.id);
                }
            });

            clearCompleted.addEventListener("click", clearCompletedTodos);

            filterBtns.forEach((btn) => {
                btn.addEventListener("click", () => {
                    filterBtns.forEach((b) => b.classList.remove("active"));
                    btn.classList.add("active");
                    currentFilter = btn.dataset.filter;
                    render();
                });
            });

            // Initial fetch and render
            async function init() {
                await fetchTodos();
                render();
            }
            init();

            // ── Chat widget ──
            const chatBubble = document.getElementById("chatBubble");
            const chatPanel = document.getElementById("chatPanel");
            const chatClose = document.getElementById("chatClose");
            const chatNew = document.getElementById("chatNew");
            const chatMessages = document.getElementById("chatMessages");
            const chatInput = document.getElementById("chatInput");
            const chatSend = document.getElementById("chatSend");
            const chatProvider = document.getElementById("chatProvider");
            const chatProviderLabel = document.getElementById("chatProviderLabel");

            let chatHistory = [];
            let chatOpen = false;
            let chatSessionId = localStorage.getItem("chatSessionId") || null;
            let chatStreaming = false;
            let chatInfo = null;

            chatBubble.addEventListener("click", () => {
                chatOpen = !chatOpen;
                chatPanel.classList.toggle("hidden", !chatOpen);
                if (chatOpen) {
                    chatInput.focus();
                    loadChatInfo();
                }
            });

            chatClose.addEventListener("click", () => {
                chatOpen = false;
                chatPanel.classList.add("hidden");
            });

            function setProviderLabel(text, state) {
                chatProviderLabel.textContent = text;
                chatProvider.classList.remove("streaming", "tool-ok", "tool-warn");
                if (state) chatProvider.classList.add(state);
                chatProvider.title = chatInfo
                    ? `${chatInfo.provider} · ${chatInfo.model}`
                    : text;
            }

            async function loadChatInfo() {
                try {
                    const res = await fetch("/api/chat/info");
                    if (!res.ok) throw new Error("info " + res.status);
                    chatInfo = await res.json();
                    const supportsTools = chatInfo.tool_use_supported;
                    const label = `${chatInfo.provider} · ${chatInfo.model}`;
                    setProviderLabel(label, supportsTools ? "tool-ok" : "tool-warn");
                } catch (e) {
                    chatInfo = null;
                    setProviderLabel("offline", "tool-warn");
                }
            }

            function appendMessage(role, text) {
                const div = document.createElement("div");
                div.className = `chat-msg ${role}`;
                div.textContent = text;
                chatMessages.appendChild(div);
                chatMessages.scrollTop = chatMessages.scrollHeight;
                return div;
            }

            function appendToolEvent(text) {
                const div = document.createElement("div");
                div.className = "chat-tool-event";
                div.textContent = text;
                chatMessages.appendChild(div);
                chatMessages.scrollTop = chatMessages.scrollHeight;
                return div;
            }

            function showThinking() {
                const div = document.createElement("div");
                div.className = "chat-msg thinking";
                div.id = "chatThinking";
                div.innerHTML = '<div class="dot"></div><div class="dot"></div><div class="dot"></div>';
                chatMessages.appendChild(div);
                chatMessages.scrollTop = chatMessages.scrollHeight;
            }

            function removeThinking() {
                const el = document.getElementById("chatThinking");
                if (el) el.remove();
            }

            async function ensureSession() {
                if (chatSessionId) {
                    const res = await fetch(`/api/chat/sessions/${chatSessionId}`);
                    if (res.ok) return chatSessionId;
                    // stale session
                    chatSessionId = null;
                    localStorage.removeItem("chatSessionId");
                }
                const res = await fetch("/api/chat/sessions", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ title: "New chat" }),
                });
                if (!res.ok) throw new Error("session " + res.status);
                const session = await res.json();
                chatSessionId = session.id;
                localStorage.setItem("chatSessionId", chatSessionId);
                return chatSessionId;
            }

            function resetSession() {
                chatSessionId = null;
                chatHistory = [];
                localStorage.removeItem("chatSessionId");
                chatMessages.innerHTML = "";
            }

            chatNew.addEventListener("click", async () => {
                if (chatStreaming) return;
                resetSession();
                setProviderLabel(
                    chatInfo
                        ? `${chatInfo.provider} · ${chatInfo.model}`
                        : "connecting…",
                    chatInfo?.tool_use_supported ? "tool-ok" : "tool-warn"
                );
            });

            function consumeSSE(body, onEvent) {
                const reader = body.getReader();
                const decoder = new TextDecoder();
                let buffer = "";

                const dispatch = (raw) => {
                    // Parse one SSE event block (terminated by a blank line
                    // per spec, but Uvicorn's StreamingResponse flushes each
                    // frame after a single ``\n`` so we accept either).
                    let event = "message";
                    const dataLines = [];
                    for (const line of raw.split("\n")) {
                        if (!line || line.startsWith(":")) continue;
                        const idx = line.indexOf(":");
                        if (idx < 0) continue;
                        const field = line.slice(0, idx);
                        let value = line.slice(idx + 1);
                        if (value.startsWith(" ")) value = value.slice(1);
                        if (field === "event") event = value;
                        else if (field === "data") dataLines.push(value);
                    }
                    if (!dataLines.length) return false;
                    let parsed;
                    try {
                        parsed = JSON.parse(dataLines.join("\n"));
                    } catch {
                        return false;
                    }
                    parsed._event = event;
                    return onEvent(parsed);
                };

                return (async () => {
                    try {
                        while (true) {
                            const { value, done } = await reader.read();
                            if (done) break;
                            buffer += decoder.decode(value, { stream: true });

                            // Split on either a blank line (spec-compliant
                            // servers) or a single newline followed by an
                            // ``event:`` field (Uvicorn's StreamingResponse
                            // writes frames verbatim with only one ``\n``).
                            // The last element is an incomplete tail — keep
                            // it in the buffer.
                            const frames = buffer.split(
                                /\n\n|(?=\nevent:)/
                            );
                            buffer = frames.pop() || "";
                            for (const ev of frames) {
                                if (!ev.trim()) continue;
                                const stop = await dispatch(ev);
                                if (stop) {
                                    try { await reader.cancel(); } catch (_) {}
                                    return;
                                }
                            }
                        }
                        // Drain any trailing event after the stream ends.
                        if (buffer.trim()) {
                            await dispatch(buffer);
                        }
                    } finally {
                        try { reader.releaseLock(); } catch (_) {}
                    }
                })();
            }

            async function sendChat() {
                const text = chatInput.value.trim();
                if (!text || chatStreaming) return;

                chatInput.value = "";
                chatInput.style.height = "auto";
                chatSend.disabled = true;
                chatStreaming = true;
                setProviderLabel(
                    chatInfo
                        ? `${chatInfo.provider} · ${chatInfo.model}`
                        : "thinking…",
                    "streaming"
                );

                appendMessage("user", text);
                showThinking();

                let sessionId;
                try {
                    sessionId = await ensureSession();
                } catch (e) {
                    removeThinking();
                    chatStreaming = false;
                    chatSend.disabled = false;
                    setProviderLabel("session error", "tool-warn");
                    appendMessage("assistant", "Could not start a chat session.");
                    return;
                }

                let assistantEl = null;
                let buffer = "";
                let finalText = "";

                try {
                    const res = await fetch("/api/chat/stream", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ message: text, session_id: sessionId }),
                    });

                    removeThinking();

                    if (!res.ok || !res.body) {
                        appendMessage("assistant", "Error: " + res.status);
                        return;
                    }

                    await consumeSSE(res.body, (ev) => {
                        if (ev._event === "token") {
                            buffer += ev.content || ev.delta || "";
                            if (!assistantEl) {
                                assistantEl = appendMessage("assistant", "");
                            }
                            assistantEl.textContent = buffer;
                            chatMessages.scrollTop = chatMessages.scrollHeight;
                        } else if (ev._event === "tool") {
                            // Any text streamed before a tool call is just preamble,
                            // not the final answer. Clear it so the user doesn't see it.
                            buffer = "";
                            if (assistantEl) assistantEl.textContent = "";

                            // Only show tool-call details for providers with native
                            // tool support. For Ollama etc. the trace is noisy.
                            if (chatInfo && chatInfo.tool_use_supported) {
                                const name = ev.name || "tool";
                                const args = ev.arguments
                                    ? JSON.stringify(ev.arguments)
                                    : "";
                                appendToolEvent(`→ ${name}${args ? "  " + args : ""}`);
                            }
                        } else if (ev._event === "tool_result") {
                            const name = ev.name || "tool";
                            const snippet = (ev.content || "").slice(0, 80);
                            appendToolEvent(`← ${name}  ${snippet}`);
                        } else if (ev._event === "done") {
                            finalText = ev.response != null ? ev.response : buffer;
                        } else if (ev._event === "error") {
                            appendMessage(
                                "assistant",
                                "Error: " + (ev.message || "unknown")
                            );
                            return true;
                        }
                        return false;
                    });

                    if (!finalText && buffer) finalText = buffer;
                    if (assistantEl) {
                        assistantEl.textContent = finalText;
                    } else if (finalText) {
                        appendMessage("assistant", finalText);
                    } else {
                        appendMessage(
                            "assistant",
                            "(no response from model)"
                        );
                    }

                    chatHistory.push({ role: "user", content: text });
                    chatHistory.push({ role: "assistant", content: finalText });

                    await fetchTodos();
                    render();
                } catch (err) {
                    removeThinking();
                    appendMessage("assistant", "Network error. Please try again.");
                } finally {
                    chatStreaming = false;
                    chatSend.disabled = false;
                    setProviderLabel(
                        chatInfo
                            ? `${chatInfo.provider} · ${chatInfo.model}`
                            : "connecting…",
                        chatInfo?.tool_use_supported ? "tool-ok" : "tool-warn"
                    );
                    chatInput.focus();
                }
            }

            chatSend.addEventListener("click", sendChat);

            chatInput.addEventListener("keydown", (e) => {
                if (e.key === "Enter" && !e.shiftKey) {
                    e.preventDefault();
                    sendChat();
                }
            });

            // Auto-resize textarea
            chatInput.addEventListener("input", () => {
                chatInput.style.height = "auto";
                chatInput.style.height = Math.min(chatInput.scrollHeight, 100) + "px";
            });

            // Load provider info on page load
            loadChatInfo();
        </script>
    </body>
</html>
