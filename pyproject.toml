[project]
name = "mytodo"
version = "0.3.0"
description = "A ToDo app with simple design and AI integration"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162.0",
    "uvicorn[standard]>=0.53.0",
    "pydantic>=2.14.2",
    "pydantic-settings>=2.16.2",
    "sqlalchemy[asyncio]>=2.0.51",
    "sqlmodel>=0.0.48",
    "aiosqlite>=0.20.0",
    "python-dotenv>=1.2.4",
    "fastmcp>=2.0.0",
    "anthropic>=0.115.1",
    "litellm>=1.106.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "httpx>=0.28",
    "pytest-cov>=6.0",
    "ruff>=0.17.3",
    "mypy>=2.4.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "RUF"]
ignore = ["B008"]  # FastAPI Depends() in defaults is intentional

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]
