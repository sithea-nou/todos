# Pre-commit hooks for MyToDo.
# Install once with: uv run pre-commit install
# Run manually with:  uv run pre-commit run --all-files
---
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.16
    hooks:
      - id: ruff
        args: [check, app/, tests/, --fix]
        files: ^(app|tests)/.*\.py$

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.1.0
    hooks:
      - id: mypy
        args: [app/]
        files: ^app/.*\.py$
        additional_dependencies:
          - pydantic>=2.0
          - pydantic-settings>=2.6.0
          - sqlmodel>=0.0.22
          - sqlalchemy>=2.0.0
          - fastapi>=0.115.0
          - fastmcp>=2.0.0
          - litellm>=1.88.1
          - anthropic>=0.107.1